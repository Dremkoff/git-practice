services:
  node:
    image: "node:alpine"
    container_name: node
    working_dir: /myapp
    build:
      dockerfile: ./Dockerfile
    command: ["npm", "run", "start"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${PGUSER}
      PGHOST: ${PGHOST}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: ${PGPORT}
  postgres:
    image: "postgres:latest"
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_PORT: ${PGPORT}
      POSTGRES_HOST: ${PGHOST}
    volumes:
      - ./src/database:/myapp/db
    ports:
      - "${PGPORT}:${PGPORT}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PGUSER}", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
